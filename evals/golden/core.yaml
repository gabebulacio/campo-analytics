# Golden set. NEVER used as prompt examples (tests/test_semantic_lint.py enforces disjointness).
# expect.status: answered | clarification | not_answered
# Answered cases are scored on result equality against expect.plan (order-insensitive).

# ---------------- verified (no LLM needed) ----------------
- id: v01
  question: "¿Qué porcentaje de la superficie es libre de deforestación según EUDR por país?"
  workspace: compliance
  tags: [simple, breakdown, ratio, verified]
  expect: { status: answered, tier: VERIFIED, verified_query_id: vq_eudr_deforestation_free_share_by_country,
            plan: { metrics: [deforestation_free_share, assessed_hectares], dimensions: [country], filters: { standard: EUDR } } }
- id: v02
  question: "What is the compliance rate by standard for season 2023/24?"
