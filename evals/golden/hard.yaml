# Harder golden cases: stacked filters, plain-language and misspelled phrasings, two metrics at once,
# natural country and program names, plausible out-of-scope asks and injections hidden inside real questions.
# Same rules as core.yaml: never used as prompt examples; answered cases are scored on result equality.

